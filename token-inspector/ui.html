  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font: 12px/1.4 -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px;
         color: var(--figma-color-text, #1c1b28); background: var(--figma-color-bg, #fff);
         display: flex; flex-direction: column; }
  .content { flex: 1; overflow: auto; min-height: 0; }
  .brandbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; height: 72px; }
  .brandbar img { height: 72px; width: auto; flex: none; }
  .brand { flex: 1; font-family: 'PixelFont', ui-monospace, monospace; font-size: 22px;
           line-height: 1.5; letter-spacing: 1px; color: var(--figma-color-text, #1c1b28); }
  .brand span { display: block; }
  .tabs { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; padding-top: 10px;
          border-top: 1px solid var(--figma-color-border, #e1e4f0); }
  .tabrow { display: flex; gap: 4px; }
  .tab { flex: 1; padding: 7px 8px; text-align: center; border-radius: 6px; cursor: pointer;
         background: var(--figma-color-bg-secondary, #f0f0f3); user-select: none; }
  .tab.full { width: 100%; }
  .tab.active { background: var(--figma-color-bg-brand, #1c1b28); color: #fff; }
  .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  select, input, button { font: inherit; padding: 7px 8px; border-radius: 6px;
         border: 1px solid var(--figma-color-border, #e1e4f0); background: var(--figma-color-bg, #fff); color: inherit; }
  select { width: 100%; }
  input#search { width: 100%; margin-bottom: 6px; }
  .grp { font-weight: 600; padding: 6px 4px; cursor: pointer; display: flex; justify-content: space-between;
         color: var(--figma-color-text-secondary, #66687a); user-select: none; }
  .grp .cnt { font-weight: 400; opacity: .7; }
  .tok { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 14px; border-radius: 6px; cursor: pointer; }
  .tok:hover { background: var(--figma-color-bg-hover, #f8f9fd); }
  .sw { width: 14px; height: 14px; border-radius: 3px; flex: none;
        border: 1px solid rgba(128,128,128,.35); background-image:
        linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),
        linear-gradient(45deg,#ccc 25%,#fff 25%,#fff 75%,#ccc 75%); background-size: 8px 8px; background-position: 0 0,4px 4px; }
  .valtag { min-width: 28px; text-align: center; font-size: 10px; font-variant-numeric: tabular-nums;
            color: var(--figma-color-text-secondary, #8e90a3); flex: none; }
  .tok .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary { font-weight: 600; margin: 10px 0 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 6px; }
  .row.clk { cursor: pointer; } .row.clk:hover { background: var(--figma-color-bg-hover, #f8f9fd); }
  .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .badges { font-size: 10px; color: var(--figma-color-text-secondary, #8e90a3); }
  .row .c { font-variant-numeric: tabular-nums; color: var(--figma-color-text-secondary, #66687a); margin-left: 8px; }
  .empty { color: var(--figma-color-text-secondary, #8e90a3); padding: 12px 4px; }
  .back { color: var(--figma-color-text-secondary,#66687a); cursor: pointer; padding: 4px; display: inline-block; }
  .pane { display: none; } .pane.active { display: block; }
  .hint { color: var(--figma-color-text-secondary, #66687a); margin: 8px 0; }
  .scope { font-size:11px; color:var(--figma-color-text-secondary,#66687a); white-space:nowrap; display:flex; align-items:center; gap:4px; cursor:pointer; }
</style>

  <div class="content">
    <div class="pane active" id="p1">
      <div id="browse">
        <div class="toolbar"><select id="collSelect"></select><label class="scope" title="По умолчанию — только текущая страница"><input type="checkbox" id="allPages" checked> все стр.</label></div>
        <input id="search" placeholder="Поиск токена..." autocomplete="off">
        <div id="tokenPicker" class="list"></div>
      </div>
      <div id="results" style="display:none">
        <span class="back" id="backBtn">&larr; назад к списку</span>
        <div id="tokenSummary" class="summary"></div>
        <div id="tokenList" class="list"></div>
      </div>
    </div>
    <div class="pane" id="p2">
      <div class="hint">Выдели компонент/инстанс/слой &rarr; «Скан выделения». Клик по токену — кто ещё его использует.</div>
      <button id="selBtn">Скан выделения</button>
      <div id="selSummary" class="summary"></div>
      <div id="selList" class="list"></div>
    </div>
    <div class="pane" id="p3">
      <div id="deadSummary" class="summary"></div>
      <div id="deadList" class="list"></div>
    </div>
  </div>
  <div class="tabs">
    <div class="tabrow">
      <div class="tab active" data-pane="p1">Токен &rarr; компоненты</div>
      <div class="tab" data-pane="p2">Компонент &rarr; токены</div>
    </div>
    <div class="tab full" data-pane="p3">💀 Мёртвые токены</div>
  </div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function post(m) { parent.postMessage({ pluginMessage: m }, '*'); }
  var ALL = [], openGroups = {}, deadDone = false;
  var tabs = document.querySelectorAll('.tab');
  function activateTab(pane) {
    tabs.forEach(function (x) { x.classList.remove('active'); });
    document.querySelectorAll('.pane').forEach(function (p) { p.classList.remove('active'); });
    document.querySelector('.tab[data-pane="' + pane + '"]').classList.add('active');
    $(pane).classList.add('active');
    if (pane === 'p3' && !deadDone) { deadDone = true; $('deadSummary').textContent = 'Сканирую...'; post({ type: 'scan-dead' }); }
  }
  tabs.forEach(function (t) { t.onclick = function () { activateTab(t.getAttribute('data-pane')); }; });
  function groupOf(name) { var i = name.indexOf('/'); return i === -1 ? name : name.slice(0, i); }
  function renderPicker() {
    var coll = $('collSelect').value, q = $('search').value.trim().toLowerCase();
    var items = ALL.filter(function (t) {
      if (coll !== '*' && t.collection !== coll) return false;
      if (q && t.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var groups = {};
    items.forEach(function (t) { var g = groupOf(t.name); (groups[g] = groups[g] || []).push(t); });
    var keys = Object.keys(groups).sort();
    var box = $('tokenPicker'); box.innerHTML = '';
    if (!keys.length) { box.innerHTML = '<div class="empty">Нет токенов.</div>'; return; }
    keys.forEach(function (g) {
      var open = q ? true : !!openGroups[g];
      var head = document.createElement('div');
      head.className = 'grp';
      head.innerHTML = '<span>' + (open ? '▾ ' : '▸ ') + g + '</span><span class="cnt">' + groups[g].length + '</span>';
      head.onclick = function () { openGroups[g] = !open; renderPicker(); };
      box.appendChild(head);
      if (open) groups[g].forEach(function (t) {
        var row = document.createElement('div'); row.className = 'tok';
        var mark = t.swatch
          ? '<span class="sw" style="background:' + t.swatch + '"></span>'
          : '<span class="valtag">' + (t.value != null ? t.value : '') + '</span>';
        row.innerHTML = mark + '<span class="nm">' + t.name + '</span>';
        row.onclick = function () { scan(t.id, t.name); };
        box.appendChild(row);
      });
    });
  }
  function scan(id, name) {
    activateTab('p1');
    $('browse').style.display = 'none'; $('results').style.display = 'block';
    $('tokenSummary').textContent = 'Сканирую «' + name + '»...'; $('tokenList').innerHTML = '';
    post({ type: 'scan-token', id: id, allPages: document.getElementById('allPages').checked });
  }
  function badges(r) {
    if (!r.kinds) return '';
    return Object.keys(r.kinds).sort().map(function (k) { return k + ' ' + r.kinds[k]; }).join(' · ');
  }
  function renderRows(container, rows, onClick) {
    container.innerHTML = '';
    if (!rows.length) { container.innerHTML = '<div class="empty">Ничего не найдено.</div>'; return; }
    rows.forEach(function (r) {
      var d = document.createElement('div'); d.className = 'row' + (onClick ? ' clk' : '');
      var nm = r.deleted ? ('⚠️ ' + r.name + ' (удалён)') : r.name; d.innerHTML = '<div class="n">' + nm + '<div class="badges">' + badges(r) + '</div></div><div class="c">' + r.count + '</div>';
      if (onClick) d.onclick = function () { onClick(r); };
      container.appendChild(d);
    });
  }
  $('backBtn').onclick = function () { $('results').style.display = 'none'; $('browse').style.display = 'block'; };
  $('search').oninput = renderPicker;
  $('collSelect').onchange = renderPicker;
  $('selBtn').onclick = function () { $('selSummary').textContent = 'Сканирую...'; post({ type: 'scan-selection' }); };
  onmessage = function (e) {
    var msg = e.data.pluginMessage; if (!msg) return;
    if (msg.type === 'token-list') {
      ALL = msg.tokens;
      var colls = (msg.collections && msg.collections.length) ? msg.collections.slice() : [];
      if (!colls.length) { ALL.forEach(function (t) { if (colls.indexOf(t.collection) === -1) colls.push(t.collection); }); colls.sort(); }
      var sel = $('collSelect'); sel.innerHTML = '<option value="*">Все коллекции</option>';
      colls.forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      if (colls.indexOf('Theme') !== -1) sel.value = 'Theme';
      renderPicker();
    }
    else if (msg.type === 'progress') { $('tokenSummary').textContent = 'Сканирую… стр. ' + msg.page + '/' + msg.total + ' · узлов ' + msg.seen; }
    else if (msg.type === 'progress-dead') { $('deadSummary').textContent = 'Сканирую… стр. ' + msg.page + '/' + msg.total + ' · узлов ' + msg.seen; }
    else if (msg.type === 'token-result') {
      $('tokenSummary').textContent = msg.total + ' привязок · ' + msg.rows.length + ' компонентов';
      renderRows($('tokenList'), msg.rows, function (r) { if (r.id) post({ type: 'select-node', id: r.id }); });
    }
    else if (msg.type === 'selection-result') {
      $('selSummary').textContent = msg.name ? (msg.name + ' — ' + msg.rows.length + ' токенов') : 'Ничего не выделено';
      renderRows($('selList'), msg.rows, function (r) { if (r.id) scan(r.id, r.name); });
    }
    else if (msg.type === 'dead-result') {
      $('deadSummary').textContent = msg.dead.length ? ('Мёртвые токены (' + msg.dead.length + '):') : 'Мёртвых токенов нет.';
      $('deadList').innerHTML = msg.dead.map(function (n) { return '<div class="row"><div class="n">' + n + '</div></div>'; }).join('');
    }
    else if (msg.type === 'error') { $('tokenSummary').textContent = 'Ошибка: ' + msg.message; }
  };
</script>
